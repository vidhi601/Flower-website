<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Checkout | FloraVibe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-checkout">
    <nav class="navbar">
        <div class="navbar__logo">FLORA<span>VIBE</span></div>
        <a href="flower.html" class="nav__link"><i class="fa-solid fa-arrow-left"></i> Back to Shop</a>
    </nav>

    <main class="checkout-container">
        <div class="checkout-grid">
            <div class="checkout-form">
                <h2 class="section-heading">Delivery Address</h2>
                <form id="orderForm" onsubmit="handleOrder(event)">
                    <div class="form-group"><input type="text" placeholder="Full Name" required></div>
                    <div class="form-group"><textarea placeholder="Complete Address" required></textarea></div>
                    <div class="form-group"><input type="tel" placeholder="Phone Number" required></div>
                    <button type="submit" class="btn--primary" style="width: 100%;">Place Order</button>
                </form>
            </div>
            <div class="order-summary">
                <h3>Summary</h3>
                <div id="checkout-items"></div>
                <hr>
                <div class="total-row">Total: ₹<span id="final-total">0</span></div>
            </div>
        </div>
    </main>

    <div id="successModal" class="modal">
        <div class="modal-content">
            <div style="font-size: 60px; margin-bottom: 10px;">🎉💐🎊</div>
            <h2>Order Successfully Placed!</h2>
            <p>Your blooms are being prepared. Get ready for some fresh vibes!</p>
            <a href="flower.html" class="btn--primary" style="margin-top:20px; text-decoration: none;">Return Home</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
